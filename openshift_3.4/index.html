<!DOCTYPE html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello World!</title>
</head>
<body>
<h1>Hello World!</h1>
<p style="color:red" id="p" aria-placeholder="Ich heisse ..."></p>
<textarea placeholder="Enter your name" id="ta"></textarea>
<button onclick="
    const name = document.getElementById('ta').value;
    document.getElementById('p').innerText = 'My name is ' + name;">Click me!</button>
</body>
